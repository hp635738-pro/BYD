<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
    <title>BYD</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <div class="content">
        <header class="heading">
          <div class="brand">
            <span class="brand-dot" aria-hidden="true"></span>
            <span class="brand-name">BYD</span>
          </div>
          <h1 class="title">BYD</h1>
          <p class="subtitle">Update your project directly from GitHub</p>
        </header>

        <!-- Repository picker — subtle glass surface, not a heavy card. -->
        <section class="repo-panel" aria-label="Repository">
          <div class="repo-meta">
            <span class="repo-label">Repository</span>
            <span id="repo-path" class="repo-path" title="Selected BYD repository"></span>
          </div>
          <button id="btn-select" class="btn btn-secondary" type="button">Choose BYD repository folder</button>
        </section>

        <!-- Primary actions — lightweight vertical stack, no surrounding panel. -->
        <section class="actions" aria-label="Update actions">
          <button id="btn-pull" class="btn btn-primary" type="button">
            <span class="btn-label">Pull from GitHub</span>
          </button>

          <button id="btn-update" class="btn btn-update" type="button" disabled>
            <span class="btn-label">Update</span>
          </button>
        </section>

        <section class="status" aria-live="polite">
          <div id="status-line" class="status-line" role="status">
            <span id="status-dot" class="status-dot" aria-hidden="true"></span>
            <span id="status-text" class="status-text">Ready.</span>
          </div>

          <pre id="output" class="output" hidden></pre>
        </section>

        <footer class="footer">
          <span id="ui-source" class="ui-source" title="Where the interface files currently shown were loaded from"></span>
        </footer>
      </div>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
